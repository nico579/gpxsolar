name: CI cross-platform

on:
  push:
    paths:
      - 'gpxsolar.py'
      - 'test_gpxsolar.py'
      - '_loader.py'
      - 'deploy.py'
      - 'update_app.py'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'gpxsolar.py'
      - 'test_gpxsolar.py'
      - '_loader.py'
      - 'deploy.py'
      - 'update_app.py'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  # Lint rapide (quelques secondes) : échoue avant de payer la matrice 3 OS.
  # Règles F (pyflakes) seulement, config dans pyproject.toml : imports
  # inutilisés, variables mortes, noms non définis. Aligné sur le jumeau
  # lidar2map, où ce job a attrapé un F821 réel (nom supprimé encore
  # référencé dans une branche que ni py_compile ni les tests n'exercent).
  lint:
    name: ruff (pyflakes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    # bootstrap=none : le module vérifie que les deps critiques sont importables
    # (via find_spec) puis continue SANS créer de venv ni relancer. Indispensable
    # en CI, sinon `import gpxsolar` tenterait de bootstrapper un venv.
    env:
      GPXSOLAR_BOOTSTRAP: none

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Syntaxe Python
        run: python -c "import ast; ast.parse(open('gpxsolar.py', encoding='utf-8').read()); print('OK')"

      - name: Syntaxe _loader.py
        run: python -c "import ast; ast.parse(open('_loader.py', encoding='utf-8').read()); print('OK')"

      - name: Dependances critiques communes
        run: pip install pytz srtm.py pysolar gpxpy pandas requests numpy timezonefinder pywebview simplekml shapely Pillow pyproj rasterio

      - name: Backend GUI Qt (Linux + Windows)
        # Windows utilise désormais le backend Qt (plus WinForms) -> PyQt6 fait
        # partie des deps critiques sur Windows aussi (cf. _gui_deps_plateforme).
        if: runner.os == 'Linux' || runner.os == 'Windows'
        run: pip install PyQt6 PyQt6-WebEngine qtpy

      - name: Backend GUI Qt + Cocoa (macOS)
        if: runner.os == 'macOS'
        run: pip install PyQt6 PyQt6-WebEngine qtpy pyobjc-framework-WebKit pyobjc-framework-Cocoa

      - name: Import complet sans erreur
        run: |
          python -c "
          import sys
          sys.argv = ['gpxsolar.py']
          try:
              import gpxsolar
          except SystemExit:
              pass
          print('Import OK')
          "

      - name: Aide CLI (smoke test argparse)
        run: python gpxsolar.py --help

      - name: Tests de caractérisation (test_gpxsolar.py)
        # Extraction ast des fonctions pures, pas d'import du module : ne
        # dépend que de numpy (déjà installé ci-dessus). Couvre bilinéaire,
        # antiméridien, clé du cache solaire, moteur de ray-tracing (chunké
        # vs référence point à point) et géométrie des rayons KML.
        run: python test_gpxsolar.py
