name: CI cross-platform

on:
  push:
    paths:
      - 'gpxsolar.py'
      - 'test_gpxsolar.py'
      - 'test_dossiers.py'
      - 'test_installation.py'
      - 'test_serve_web.py'
      - 'test_amorcage_commun.py'
      - 'exe_smoke.py'
      - '_*.py'
      - 'gui/**'
      - 'assets/**'
      - 'deploy.py'
      - 'smoke_gpxsolar.py'
      - 'pyproject.toml'
      - 'requirements*.in'
      - 'requirements*.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'gpxsolar.py'
      - 'test_gpxsolar.py'
      - 'test_dossiers.py'
      - 'test_installation.py'
      - 'test_serve_web.py'
      - 'test_amorcage_commun.py'
      - 'exe_smoke.py'
      - '_*.py'
      - 'gui/**'
      - 'assets/**'
      - 'deploy.py'
      - 'smoke_gpxsolar.py'
      - 'pyproject.toml'
      - 'requirements*.in'
      - 'requirements*.txt'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

# Droits minimaux du GITHUB_TOKEN : lecture seule. Un job qui publie
# déclare lui-même le droit d'écriture dont il a besoin.
permissions:
  contents: read

jobs:
  # Lint rapide (quelques secondes) : échoue avant de payer la matrice 3 OS.
  # Règles F (pyflakes) seulement, config dans pyproject.toml : imports
  # inutilisés, variables mortes, noms non définis. Aligné sur le jumeau
  # lidar2map, où ce job a attrapé un F821 réel (nom supprimé encore
  # référencé dans une branche que ni py_compile ni les tests n'exercent).
  lint:
    name: ruff (pyflakes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installer ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    # bootstrap=none : le module vérifie que les deps critiques sont importables
    # (via find_spec) puis continue SANS créer de venv ni relancer. Indispensable
    # en CI, sinon `import gpxsolar` tenterait de bootstrapper un venv.
    env:
      GPXSOLAR_BOOTSTRAP: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Syntaxe Python
        run: python -c "import ast; ast.parse(open('gpxsolar.py', encoding='utf-8').read()); print('OK')"

      - name: Syntaxe _loader.py
        run: python -c "import ast; ast.parse(open('_loader.py', encoding='utf-8').read()); print('OK')"

      - name: Installer les dependances
        # Le verrou, comme le mode sources et les binaires livres : plus de
        # liste tenue a la main ici, et les memes versions partout.
        run: pip install --require-hashes -r requirements.txt

      - name: Import complet sans erreur
        run: |
          python -c "
          import sys
          sys.argv = ['gpxsolar.py']
          try:
              import gpxsolar
          except SystemExit:
              pass
          print('Import OK')
          "

      - name: Aide CLI (smoke test argparse)
        run: python gpxsolar.py --help

      - name: Tests de caractérisation (test_gpxsolar.py)
        # Extraction ast des fonctions pures, pas d'import du module : ne
        # dépend que de numpy (déjà installé ci-dessus). Couvre bilinéaire,
        # antiméridien, clé du cache solaire, moteur de ray-tracing (chunké
        # vs référence point à point) et géométrie des rayons KML.
        run: python test_gpxsolar.py

      - name: Installation et ménage de l'ancien lanceur (test_installation.py)
        # Depuis la 1.5, le programme est livré tel quel : ce qu'un lanceur
        # <= 1.4 laissait est retiré au démarrage, comme les fichiers de Qt
        # que la 1.5.0 laisse dans _internal, jamais le dossier d'où
        # tourne le programme, et --desinstaller ne supprime jamais celui-ci.
        run: python test_installation.py

      - name: Amorcage des dependances (test_amorcage_commun.py)
        # Le moteur est _amorcage.py, copie octet pour octet de
        # nico579_commons.amorcage (teste dans nico579-commons) : ici, que la
        # copie n'a pas derive du paquet installe et que gpxsolar l'appelle bien.
        run: python test_amorcage_commun.py

      - name: Dossiers d'état et de sorties (test_dossiers.py)
        # Reprise unique de l'état d'une version <= 1.3, chemins de la ligne
        # de commande, et un vrai lancement de gpxsolar.py qui ne doit rien
        # créer. Dossiers isolés : jamais ceux du runner.
        run: python test_dossiers.py

      - name: Interface web (test_serve_web.py)
        # Depuis la 1.6.0, l'interface est servie en HTTP local : serveur,
        # refus des provenances étrangères, instance déjà ouverte, nouvelle
        # instance, parcours des fichiers, et accord entre la page, le pont
        # web_bridge.js et les routes du serveur.
        run: python test_serve_web.py

  # Chaque système de construction de release.yml (windows-latest,
  # ubuntu-latest, macos-latest, macos-15-intel) doit pouvoir installer les
  # deux verrous, avec son Python 3.12 et son macOS 15 : un verrou régénéré
  # qui choisirait une version sans roue pour l'un d'eux casserait sa
  # construction, le jour de la release. Les paquets livrés en source sont
  # listés par système, exactement : un nouveau paquet sans roue fait échouer
  # ce job au lieu de passer inaperçu.
  #   simplekml, srtm-py : publiés en source seulement, partout ;
  #   timezonefinder     : des roues pour Linux seulement depuis la 8.2, pip
  #                        le compile ailleurs (les runners ont un compilateur) ;
  #   h3                 : pas de roue pour les Mac Intel.
  verrous:
    name: Verrous des dependances
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installer uv
        run: pip install uv==0.9.28

      - name: Roues pour les quatre systemes de construction
        env:
          MACOSX_DEPLOYMENT_TARGET: "15.0"
        run: |
          for verrou in requirements.txt requirements-build.txt; do
            for cible in x86_64-pc-windows-msvc x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin; do
              case "$cible" in
                x86_64-unknown-linux-gnu) sources="simplekml,srtm-py" ;;
                x86_64-apple-darwin) sources="simplekml,srtm-py,timezonefinder,h3" ;;
                *) sources="simplekml,srtm-py,timezonefinder" ;;
              esac
              echo "== $verrou pour $cible (en source : $sources)"
              uv pip compile "$verrou" --python-platform "$cible" --python-version 3.12 \
                --only-binary :all: --no-binary "$sources" --no-header -q -o /tmp/roues.txt
            done
          done
