name: Release (build 3 OS)

# Build des exécutables autonomes sur les 3 OS puis publication sur la release.
# PyInstaller n'est pas un cross-compilateur : chaque binaire DOIT être produit
# sur son OS/arch natif. Ce workflow le fait sur les runners GitHub.
#
# Déclenchement :
#   - push d'un tag v*           (ex: git tag v1.0.0 && git push origin v1.0.0)
#   - manuel (workflow_dispatch) avec saisie du tag ; publier=false construit
#     et éprouve les 4 binaires sans rien publier, pour valider une branche
#     qui touche au build avant de l'étiqueter
#
# Assets produits :
#   gpxsolar-windows-x86_64.zip     (dossier : gpxsolar.exe + _internal/)
#   gpxsolar-linux-x86_64.tar.gz    (dossier : gpxsolar     + _internal/)
#   gpxsolar-macos-arm64.zip        (GPXSOLAR.app zippé via ditto, Apple Silicon)
#   gpxsolar-macos-x86_64.zip       (idem, Mac Intel)
#
# Depuis la 1.5, chaque archive contient le programme tel quel (dossier
# onedir de PyInstaller, ou .app), comme celles de lidar2map. Jusqu'à la 1.4,
# un lanceur l'extrayait d'un bundle zippé au premier lancement. Le nom des
# archives et de leur dossier racine n'a pas changé : décompressée par-dessus
# la précédente, une archive met le programme à la place du lanceur, au même
# chemin (raccourcis compris).
#
# Deux runners macOS : macos-latest est Apple Silicon depuis 2024, il ne peut
# donc plus produire de binaire Intel. macos-15-intel est le dernier runner
# x86_64 standard (gratuit sur repo public), annoncé jusqu'à août 2027.
# Après cette date, il faudra soit abandonner l'asset Intel, soit builder sur
# une machine Intel perso.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release (ex: v1.0.0)'
        required: true
      publier:
        description: 'Publier la release (décocher : construire et éprouver seulement)'
        type: boolean
        default: true

# Droits minimaux du GITHUB_TOKEN : lecture seule. Un job qui publie
# déclare lui-même le droit d'écriture dont il a besoin.
permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-15-intel]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # ── Windows ──────────────────────────────────────────────────────────
      - name: Setup machine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\setup_build_windows.ps1

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gpxsolar_win_build.ps1

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Le dossier onedir devient le dossier racine de l'archive, sous le
          # nom qu'elle a toujours eu (voir l'en-tête).
          $stage = "dist\gpxsolar-windows-x86_64"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          Move-Item dist\gpxsolar $stage
          $zip = "dist\gpxsolar-windows-x86_64.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() |
            Out-File "$zip.sha256" -Encoding ascii -NoNewline

      # Lance l'archive telle qu'elle sera publiée (démarrage, ménage d'un
      # ancien lanceur) : toutes les autres suites tournent sur les sources.
      # Bloquant : le job publish exige tous les builds.
      - name: Smoke test exe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python exe_smoke.py dist\gpxsolar-windows-x86_64.zip

      # ── Linux ────────────────────────────────────────────────────────────
      - name: Setup machine (Linux)
        if: runner.os == 'Linux'
        run: bash setup_build_linux.sh

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: bash gpxsolar_linux_build.sh

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          # Le dossier onedir devient le dossier racine de l'archive.
          rm -rf dist/gpxsolar-linux-x86_64
          mv dist/gpxsolar dist/gpxsolar-linux-x86_64
          tar czf dist/gpxsolar-linux-x86_64.tar.gz -C dist gpxsolar-linux-x86_64
          sha256sum dist/gpxsolar-linux-x86_64.tar.gz | awk '{print $1}' \
            > dist/gpxsolar-linux-x86_64.tar.gz.sha256

      - name: Smoke test exe (Linux)
        if: runner.os == 'Linux'
        run: python exe_smoke.py dist/gpxsolar-linux-x86_64.tar.gz

      # ── macOS ────────────────────────────────────────────────────────────
      - name: Setup machine (macOS)
        if: runner.os == 'macOS'
        run: bash setup_build_mac.sh

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: bash gpxsolar_mac_build.sh

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # Le nom du zip porte l'archi du runner (arm64 ou x86_64) : on le
          # retrouve au glob plutôt que de le coder en dur.
          zip=$(ls dist/gpxsolar-macos-*.zip)
          shasum -a 256 "$zip" | awk '{print $1}' > "$zip.sha256"

      # Lancé depuis le shell du runner, le binaire ne passe pas par
      # Gatekeeper : ce test ne dit rien de la quarantaine.
      - name: Smoke test exe (macOS)
        if: runner.os == 'macOS'
        run: python exe_smoke.py "$(ls dist/gpxsolar-macos-*.zip)"

      # ── Upload artefact (asset + .sha256) ────────────────────────────────
      - name: Upload artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # matrix.os et non runner.os : les deux jobs macOS renverraient tous
          # deux "macOS", et upload-artifact@v4 refuse deux artefacts de même nom.
          name: asset-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/gpxsolar-*.zip
            dist/gpxsolar-*.tar.gz
            dist/gpxsolar-*.sha256

  publish:
    name: publish release
    needs: build
    # Toujours sur un tag poussé ; en lancement manuel, sauf si publier est
    # décoché (construire et éprouver seulement).
    if: github.event_name == 'push' || inputs.publier
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Composer le body + publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          # GH_REPO : le job publish ne fait pas de checkout (pas de .git),
          # donc gh ne peut pas déduire le repo via git -> on le lui donne
          # explicitement, sinon "fatal: not a git repository".
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Collecter les assets (zip/tar.gz) et leurs SHA256
          ASSETS=()
          BODY=$'## gpxsolar '"$TAG"$'\n\nExécutables autonomes (Python + dépendances embarqués, aucune installation).\n\nL’archive contient le programme lui-même : il démarre sans extraction préalable. Mise à jour : décompresser cette archive par-dessus la précédente (sous macOS, remplacer GPXSOLAR.app). Ce que le lanceur d’une version 1.4 ou antérieure laissait sur le disque est retiré au démarrage.\n\n| Fichier | SHA256 |\n|---|---|\n'
          while IFS= read -r sha; do
            asset="${sha%.sha256}"
            name="$(basename "$asset")"
            hash="$(tr -d '[:space:]' < "$sha")"
            BODY+="| \`$name\` | \`$hash\` |"$'\n'
            ASSETS+=("$asset")
          done < <(find artifacts -name '*.sha256' | sort)

          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "ERREUR : aucun asset trouvé dans artifacts/" >&2
            exit 1
          fi
          printf '%s' "$BODY" > body.md
          echo "── Body de la release ──"; cat body.md
          echo "── Assets ──"; printf '  %s\n' "${ASSETS[@]}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit   "$TAG" --notes-file body.md
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "gpxsolar $TAG" --notes-file body.md
          fi
          echo "Release $TAG publiée."
